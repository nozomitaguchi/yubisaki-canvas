<style>
  html{color-scheme:light}
  body{margin:0}
  [hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
  :root{
    --ink:#2b2745; --muted:#6a6485;
    --glass:rgba(255,255,255,.82); --glass-strong:rgba(255,255,255,.96);
    --hair:rgba(43,39,69,.12); --focus:#7b5cff; --cur:#7b5cff;
    --shadow:0 10px 30px rgba(70,50,130,.18);
    font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  }
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#f3f0fb;color:var(--ink)}
  #app{position:fixed;inset:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
  button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:focus-visible,label:focus-within{outline:3px solid var(--focus);outline-offset:2px}

  .top{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;flex-wrap:nowrap;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
  .top>*{pointer-events:auto}
  .worlds{display:flex;gap:2px;padding:5px;max-width:calc(100% - 160px);overflow-x:auto;scrollbar-width:none;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:999px;box-shadow:var(--shadow)}
  .worlds::-webkit-scrollbar{display:none}
  .worlds button{flex:0 0 auto;display:flex;align-items:center;gap:5px;border:0;background:transparent;font-weight:700;font-size:14px;padding:5px 6px;min-height:46px;border-radius:999px;color:var(--muted);transition:background .2s,color .2s}
  .ic{font-size:24px;line-height:1;display:grid;place-items:center;width:38px;height:38px}
  .ic img{width:38px;height:38px;display:block}
  .worlds button[aria-selected="true"]{background:var(--ink);color:#fff}
  .worlds button[aria-selected="true"] .ic img{filter:drop-shadow(0 0 0 #fff)}
  .sys{display:flex;gap:6px;margin-left:auto}
  .sys button{width:46px;height:46px;border:0;border-radius:50%;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
  .sys svg{width:22px;height:22px}

  .dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:30px;box-shadow:var(--shadow);max-width:calc(100% - 24px)}
  .palette{display:flex;gap:7px;padding:0 10px 0 6px;border-right:1px solid var(--hair)}
  .sw{width:32px;height:32px;border-radius:50%;border:0;background:var(--g,none) center/70% no-repeat,var(--c);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55);transition:transform .15s}
  .sw[aria-pressed="true"]{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--c);transform:scale(1.08)}
  .palette.noglyph .sw{background-image:none}
  .sw.white{box-shadow:inset 0 0 0 1.5px rgba(43,39,69,.25)}
  .sw.white[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px rgba(43,39,69,.25),0 0 0 3px #fff,0 0 0 6px #8f86b8}
  .tools{display:flex;gap:3px;align-items:center}
  .tool{white-space:nowrap;width:56px;height:56px;border:0;border-radius:20px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:700;color:var(--muted);transition:background .15s,transform .15s}
  .tool[aria-pressed="true"]{background:var(--glass-strong);color:var(--ink);box-shadow:inset 0 0 0 3px var(--cur)}
  .tool:active{transform:scale(.94)}
  .tool.own{margin-left:6px;background:var(--ink);color:#fff;border-radius:20px}
  .tool.own .ic img{filter:drop-shadow(0 0 1px rgba(255,255,255,.6))}

  .numpad{position:absolute;left:50%;transform:translateX(-50%);top:70px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:5px;padding:6px;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:28px;box-shadow:var(--shadow);max-width:calc(100% - 24px)}
  .np-n{width:44px;height:44px;border:0;border-radius:50%;background:#FDE68A;box-shadow:inset 0 0 0 3px #CFA83A;color:var(--ink);font-weight:900;font-size:19px;font-variant-numeric:tabular-nums;transition:transform .12s}
  .np-n.ten{background:#8DEBD8;box-shadow:inset 0 0 0 3px #24AFA3}
  .numpad.minus .np-n{background:#a3abbf;box-shadow:inset 0 0 0 3px #5c667e;color:#fff}
  .numpad.minus .np-n.ten{background:#86a3a1;box-shadow:inset 0 0 0 3px #4b6664}
  .np-n:active{transform:scale(.9)}
  .np-sign{height:44px;min-width:52px;border:0;border-radius:999px;padding:0 14px;background:var(--ink);color:#fff;font-weight:900;font-size:24px;line-height:1;margin-right:4px}
  .numpad[hidden]{display:none}
  .numpad.minus .np-sign{background:#5c667e}

  #hand{position:absolute;left:0;top:0;width:64px;height:64px;pointer-events:none;z-index:30;opacity:0;transition:opacity .35s;transform-origin:14px 4px;filter:drop-shadow(0 6px 10px rgba(40,30,80,.28))}
  #hand.on{opacity:.9}
  #hand svg{display:block;transition:transform .12s;transform-origin:14px 4px}
  #hand.down svg{transform:scale(.88)}
  .shake{animation:shake .4s}
  @keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  /* drawing sheet */
  .modal{position:absolute;inset:0;background:rgba(35,30,60,.45);display:grid;place-items:center;padding:16px;z-index:10}
  .modal[hidden]{display:none}
  .sheet{background:#fffdf8;border-radius:28px;box-shadow:0 20px 60px rgba(40,30,80,.35);padding:18px 18px 14px;width:min(100%,480px);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px}
  .sheet h2{margin:0;font-size:22px;font-weight:900;text-wrap:balance}
  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .drhead{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted)}
  .drhead .ic,.drhead .ic img{width:48px;height:48px}
  .drhead svg{width:30px;height:30px}
  .padwrap{display:grid;place-items:center}
  #pad{width:min(100%,50vh,440px);aspect-ratio:1;max-width:100%;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 2px var(--hair);touch-action:none;cursor:crosshair;
    background-image:radial-gradient(rgba(43,39,69,.07) 1px,transparent 1px);background-size:18px 18px}
  .padtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
  .pcolors{display:flex;flex-wrap:wrap;gap:6px}
  .pcolors .sw{width:30px;height:30px}
  .psizes{display:flex;gap:4px;background:rgba(43,39,69,.06);padding:3px;border-radius:999px}
  .psizes button{border:0;background:transparent;border-radius:999px;width:44px;min-height:36px;display:grid;place-items:center}
  .psizes i{display:block;border-radius:50%;background:var(--ink)}
  .psizes button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .actions{display:flex;flex-wrap:nowrap;gap:8px;align-items:center}
  .actions .sp{flex:1}
  .btn.ico{width:52px;height:52px;padding:0;justify-content:center}
  .btn.ico svg{width:26px;height:26px}
  .btn.primary.ico{width:72px}
  .btn{border:0;border-radius:999px;padding:10px 16px;font-weight:700;font-size:15px;min-height:44px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
  .btn.ghost{background:rgba(43,39,69,.07);color:var(--ink)}
  .btn.primary{background:var(--ink);color:#fff;padding-inline:22px}
  .btn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  .link{border:0;background:none;color:var(--muted);align-self:flex-start;padding:4px;border-radius:10px}
  .link svg{width:26px;height:26px;display:block}

  @media (max-width:760px){
    .worlds button{padding:5px 6px}
    .dock{flex-direction:column;gap:6px;border-radius:24px;padding:8px}
    .palette{border-right:0;padding:2px 2px 8px;border-bottom:1px solid var(--hair)}
    .tool{width:50px;height:50px;border-radius:16px}
    .tool.own{margin-left:2px}
    .ic,.ic img{width:32px;height:32px}
    .worlds{max-width:calc(100% - 150px)}
  }
  @media (max-width:560px){ .np-n{width:36px;height:36px;font-size:16px} .np-sign{height:36px;min-width:42px;padding:0 10px;font-size:20px} .numpad{gap:4px;padding:5px} }
  @media (max-width:440px){ .worlds{gap:0;padding:4px} .worlds button{padding:4px 3px;min-height:42px} .sys button{width:42px;height:42px} .tool{width:44px;height:46px} .tools{gap:1px} .ic,.ic img{width:28px;height:28px} .sw{width:28px;height:28px} .palette{gap:6px} }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="さわって あそべる キャンバス"></canvas>

  <header class="top">
    <nav class="worlds" role="tablist" aria-label="せかいを えらぶ" id="worlds"></nav>
    <div class="sys">
      <button id="clr" type="button" aria-label="はじめに もどす">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4v5h5"/></svg>
      </button>
      <button id="snd" type="button" aria-label="おとを けす">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path id="mute" d="m17 9 5 6m0-6-5 6" style="display:none"/></svg>
      </button>
      <button id="fs" type="button" aria-label="ぜんがめん">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </header>

  <div class="numpad" id="numpad" hidden aria-label="すうじ"></div>

  <div id="hand" aria-hidden="true"><svg viewBox="0 0 64 64" width="64" height="64"><defs><g id="hs"><rect x="9" y="3" width="11" height="34" rx="5.5"/><rect x="7" y="25" width="36" height="32" rx="11"/><circle cx="26" cy="28" r="5"/><circle cx="33.5" cy="29" r="5"/><circle cx="40" cy="31.5" r="4.5"/><ellipse cx="8" cy="42" rx="5" ry="8" transform="rotate(-30 8 42)"/></g></defs>
    <use href="#hs" fill="#2b2745" stroke="#2b2745" stroke-width="6" stroke-linejoin="round"/><use href="#hs" fill="#fff"/><path d="M14.5 9v10" stroke="rgba(43,39,69,.15)" stroke-width="2" stroke-linecap="round"/></svg></div>
  <div class="dock" id="dock">
    <div class="palette" id="palette" aria-label="いろ"></div>
    <div class="tools" id="tools" aria-label="どうぐ"></div>
  </div>

  <div class="modal" id="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="dr-title">
    <div class="sheet">
      <h2 id="dr-title" class="vh">じぶんの えを いれよう</h2>
      <div class="drhead" id="drhead" aria-hidden="true"></div>
      <div class="padwrap"><canvas id="pad" width="800" height="800" aria-label="おえかき スペース"></canvas></div>
      <div class="padtools">
        <div class="pcolors" id="pcolors" aria-label="ペンの いろ"></div>
        <div class="psizes"><button type="button" id="ps-thin" aria-pressed="false" aria-label="ほそい"><i style="width:8px;height:8px"></i></button><button type="button" id="ps-thick" aria-pressed="true" aria-label="ふとい"><i style="width:18px;height:18px"></i></button></div>
      </div>
      <div class="actions">
        <label class="btn ghost ico" id="photo-label" aria-label="しゃしんから いれる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg><input id="photo" type="file" accept="image/*"></label>
        <button class="btn ghost ico" type="button" id="pad-clear" aria-label="けす"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg></button>
        <span class="sp"></span>
        <button class="btn ghost ico" type="button" id="pad-cancel" aria-label="やめる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <button class="btn primary ico" type="button" id="pad-done" aria-label="できた"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L20 7"/></svg></button>
      </div>
      <button class="link ico" type="button" id="forget" aria-label="いれた えを ぜんぶ かたづける"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="10" height="9" rx="1.5"/><path d="M5 12l2.5-3 2 2 1.5-1.5 2 2.5"/><path d="M15 12h6M16 12l.7 8h2.6l.7-8M17 12v-2h2v2"/></svg></button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
/* =========================================================
   basics
   ========================================================= */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const bgc = document.createElement('canvas'), bg = bgc.getContext('2d');
let W = 0, H = 0, DPR = 1, GY = 0, SC = 1, clock = 0;
const TAU = Math.PI * 2, INK = '#2b2745';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT = '"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif';

const rand = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b, c, d) => Math.hypot(c - a, d - b);
const easeBack = t => { t = clamp(t, 0, 1) - 1; const c = 1.8; return 1 + t * t * ((c + 1) * t + c); };
const angNorm = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
function rgb(hex){ const n = parseInt(hex.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; }
function rgba(hex, a){ const [r, g, b] = rgb(hex); return `rgba(${r},${g},${b},${a})`; }
function mix(hex, amt){ const [r, g, b] = rgb(hex), t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  return `rgb(${Math.round(r + (t - r) * p)},${Math.round(g + (t - g) * p)},${Math.round(b + (t - b) * p)})`; }
function rr(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

const PALETTE = ['#7b5cff', '#2f80ed', '#16b5a3', '#f2b705', '#ff5c8a', '#ff7a2e'];
const WHITE = '#ffffff', UIPAL = [WHITE, ...PALETTE];
const POWER = {'#ffffff': 'normal', '#7b5cff': 'float', '#2f80ed': 'slide', '#16b5a3': 'flow', '#f2b705': 'bounce', '#ff5c8a': 'flower', '#ff7a2e': 'zap'};
const POWER_NAME = {normal: 'しろ（ふつう）', float: 'むらさき（ふわふわ）', slide: 'あお（すべりだい）', flow: 'みどり（うごくみち）', bounce: 'きいろ（トランポリン）', flower: 'ピンク（おはな）', zap: 'オレンジ（びりびり）'};
const WALKABLE = {normal: 1, flower: 1, flow: 1};
let color = WHITE;
const paintCol = () => color === WHITE ? pick(PALETTE) : color;

/* =========================================================
   sound
   ========================================================= */
let AC = null, muted = false;
function ensureAudio(){
  if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});
}
function tone(f, dur = .25, type = 'sine', vol = .12, slide = 0){
  if (!AC || muted || demoQuiet) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + .03);
}
const PENTA = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568];
let lastBonk = 0;
const sfx = {
  pop(){ tone(rand(300, 460), .18, 'sine', .16, 2.3); },
  boing(){ tone(220, .32, 'sine', .18, 2.6); },
  honk(){ tone(392, .13, 'square', .045); setTimeout(() => tone(392, .22, 'square', .045), 160); },
  whistle(){ tone(988, .5, 'triangle', .07, 1.03); setTimeout(() => tone(1175, .4, 'triangle', .06), 180); },
  munch(){ tone(rand(140, 190), .08, 'triangle', .12, .7); },
  note(y){ const i = clamp(Math.floor((1 - y / Math.max(1, GY)) * PENTA.length), 0, PENTA.length - 1); tone(PENTA[i], .5, 'triangle', .06); },
  arp(){ [0, 2, 4, 7].forEach((k, j) => setTimeout(() => tone(PENTA[k], .45, 'triangle', .06), j * 90)); },
  whoosh(){ tone(700, .55, 'sine', .06, .35); },
  thud(v = 1){ if (clock - lastBonk < .06) return; lastBonk = clock; tone(rand(110, 150), .14, 'sine', .14 * clamp(v, .2, 1), .5); },
  plip(){ tone(rand(700, 900), .12, 'sine', .1, 1.6); },
  boom(){ tone(70, .9, 'sawtooth', .08, .4); tone(110, .5, 'triangle', .1, .5); },
  zap(){ tone(1400, .35, 'sine', .05, .3); },
};

/* =========================================================
   line-art figure system
   ========================================================= */
class Fig {

const pg = () => world.phys.g * .25;
function burst(x, y, c, n = 10, sp = 170){

    addP({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: pg(), life: rand(.45, .9), size: rand(3, 7), color: c, drag: 1.6}); }
}
function hearts(x, y, n = 3){ for (let i = 0; i < n; i++) addP({kind:'heart', x: x + rand(-16, 16), y, vx: rand(-30, 30), vy: rand(-95, -55), life: 1.2, size: rand(16, 24), color: pick(['#ff5c8a', '#ff8fb1', '#ff7a2e'])}); }
function petals(x, y, c, n = 12){ for (let i = 0; i < n; i++){ const a = rand(0, TAU), s = rand(60, 200);
  addP({kind:'petal', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, g: 140, life: rand(.9, 1.5), size: rand(5, 8), color: c, rot: rand(0, 6), vr: rand(-6, 6), drag: 1.8}); } }

function say(x, y, emo, c, k = 1){ if (emo && emo[0] === '#') addP({kind:'text', x, y, vy: -45, life: 1.6, text: emo.slice(1), size: 24, color: c || INK});
  else addP({kind:'emo', emo, x, y, vy: -38, life: 1.3, size: 17 * k, color: c || INK}); }
function drawEmote(g, emo, z, col){
  g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.arc(0, 0, z, 0, TAU); g.moveTo(-z * .35, z * .9); g.lineTo(-z * .55, z * 1.35); g.lineTo(z * .05, z * .95);
  g.fillStyle = 'rgba(255,255,255,.94)'; g.fill(); g.lineWidth = 2; g.strokeStyle = 'rgba(43,39,69,.18)'; g.stroke();
  g.fillStyle = col; g.strokeStyle = col; g.lineWidth = z * .16; const u = z / 10;
  switch (emo){
    case 'heart': g.beginPath(); g.moveTo(0, 5 * u); g.bezierCurveTo(-8 * u, -1 * u, -5 * u, -8 * u, 0, -4 * u); g.bezierCurveTo(5 * u, -8 * u, 8 * u, -1 * u, 0, 5 * u); g.fill(); break;
    case 'voice': for (let i = 0; i < 3; i++){ g.beginPath(); g.arc(-5 * u, 0, (3 + i * 3.2) * u, -.75, .75); g.stroke(); } g.beginPath(); g.arc(-5 * u, 0, 1.6 * u, 0, TAU); g.fill(); break;
    case 'bang': g.beginPath(); g.moveTo(0, -6.5 * u); g.lineTo(0, 1.5 * u); g.lineWidth = z * .26; g.stroke(); g.beginPath(); g.arc(0, 5.5 * u, 1.6 * u, 0, TAU); g.fill();
      g.lineWidth = z * .1; for (const s2 of [-1, 1]){ g.beginPath(); g.moveTo(s2 * 4.5 * u, -5 * u); g.lineTo(s2 * 7 * u, -7.5 * u); g.moveTo(s2 * 5.5 * u, 0); g.lineTo(s2 * 8.5 * u, 0); g.stroke(); } break;
    case 'zap': g.beginPath(); g.moveTo(1.5 * u, -8 * u); g.lineTo(-4.5 * u, 1 * u); g.lineTo(-.5 * u, 1 * u); g.lineTo(-2 * u, 8 * u); g.lineTo(4.5 * u, -1.5 * u); g.lineTo(.5 * u, -1.5 * u); g.closePath(); g.fill(); break;
    case 'spark': { const st = (x, y, r) => { g.beginPath(); for (let i = 0; i < 8; i++){ const a = i / 8 * TAU - Math.PI / 2, rr2 = i % 2 ? r * .36 : r; g.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); } g.closePath(); g.fill(); };

    case 'rain': [[-4, -1], [1, 2], [5, -3]].forEach(([x, y]) => { g.beginPath(); g.moveTo(x * u, (y - 4) * u); g.quadraticCurveTo((x + 3) * u, (y + 1) * u, x * u, (y + 3) * u); g.quadraticCurveTo((x - 3) * u, (y + 1) * u, x * u, (y - 4) * u); g.fill(); }); break;
    case 'cold': g.lineWidth = z * .11; for (let i = 0; i < 3; i++){ const a = i / 3 * Math.PI; g.beginPath(); g.moveTo(Math.cos(a) * 7 * u, Math.sin(a) * 7 * u); g.lineTo(-Math.cos(a) * 7 * u, -Math.sin(a) * 7 * u); g.stroke(); } break;

const CELL = 48; let grid = new Map(), gridDirty = true, gq = 0;

function gridAdd(L, i){ const a = L.pts[i - 1], c = L.pts[i], e = {L, i, q: 0};
  const x0 = Math.floor(Math.min(a.x, c.x) / CELL), x1 = Math.floor(Math.max(a.x, c.x) / CELL), y0 = Math.floor(Math.min(a.y, c.y) / CELL), y1 = Math.floor(Math.max(a.y, c.y) / CELL);
  for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++){ const k = gk(cx, cy); let arr = grid.get(k); if (!arr) grid.set(k, arr = []); arr.push(e); } }

function startDemo(delay){ demoAt = clock + delay; }

const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>';

document.getElementById('forget').addEventListener('click', () => { myDrawings = []; saveDrawings(); E.forEach(e => { if (e instanceof Doodle) e.leave(); }); closeDrawer(); sfx.whoosh(); });
document.getElementById('photo').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0]; e.target.value = ''; if (!file) return;
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => { try { const cut = cutout(img); pgx.clearRect(0, 0, pad.width, pad.height); pgx.drawImage(cut, (pad.width - cut.width) / 2, (pad.height - cut.height) / 2); }
    catch (err) { shake(document.getElementById('photo-label')); } URL.revokeObjectURL(url); };
  img.onerror = () => { shake(document.getElementById('photo-label')); URL.revokeObjectURL(url); };

function cutout(img){
  const max = 760, s = Math.min(max / img.width, max / img.height), w = Math.max(1, Math.round(img.width * s)), h = Math.max(1, Math.round(img.height * s));
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.drawImage(img, 0, 0, w, h);
  const id = g.getImageData(0, 0, w, h), d = id.data;
  // paper colour: median-ish of border pixels
  const rs = [], gs = [], bs = []; const sample = (x, y) => { const i = (y * w + x) * 4; rs.push(d[i]); gs.push(d[i + 1]); bs.push(d[i + 2]); };
  for (let x = 0; x < w; x += 4){ sample(x, 0); sample(x, h - 1); sample(x, Math.floor(h * .03)); sample(x, Math.floor(h * .97)); }

    for (let y = y0; y < y1; y += 3) for (let x = x0; x < x1; x += 3){ const i = (y * w + x) * 4, l = (d[i] + d[i + 1] + d[i + 2]) / 3; if (l > best) best = l; } grid[gy * gw + gx] = Math.max(best, pl * .7); }

/* =========================================================
   loop
   ========================================================= */
function update(dt){
  clock += dt;
  wind.x = 0; for (const e of E) if (e instanceof Gust && !e.dead) wind.x += e.force();
  planets = world.phys.planets ? alive(Planet) : [];
  statics = E.filter(e => e.isStatic && !e.dead);
  for (const L of lines){ if (L.done && !L.perm){ const al = lineAlpha(L); L.ghost = al < .3; if (al <= 0) L.dead = true; } if (L.animGrow && L.grow < L.len) L.grow = Math.min(L.len, L.grow + 280 * dt); }
  if (lines.some(L => L.dead)){ lines = lines.filter(L => !L.dead); gridDirty = true; }
  bubT -= dt; if (bubT <= 0){ bubT = rand(3.5, 7); if (!world.noBubbles && alive(PaintBubble).length < 4) E.push(new PaintBubble(rand(W * .08, W * .92), world.phys.ground ? GY - 20 : rand(GY * .3, GY * .9))); }
  let nl = 0; for (const a of active.values()) if (a.mode === 'line') nl++;
  if (nl >= 2) togetherT += dt; else togetherT = 0;
  if (togetherT > .8 && clock - lastParty > 7){ lastParty = clock; party(); }
  S = S.filter(s => clock - s.born < s.life);
  tickDemo(dt);
  world.tick && world.tick(dt);
  for (const e of E) if (!e.dead){
    e.update(dt);
    if (e.ttl === undefined) e.ttl = clock + ttlFor(e);
    if (clock > e.ttl && !e.held && e.state !== 'held'){ e.fade = (e.fade || 0) + dt / LIFE.fade; if (e.fade >= 1) e.dead = true; }
  }

  if (E.some(e => e.dead)) E = E.filter(e => !e.dead);
  for (const p of P){ p.t += dt; if (p.drag){ p.vx *= 1 - p.drag * dt; p.vy *= 1 - p.drag * dt; }
    if (p.kind === 'leaf' || p.kind === 'petal') p.vx += wind.x * dt * .6;
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.kind === 'snow'){ p.vx += Math.sin(clock * 1.3 + p.x * .01) * 6 * dt; if (p.y >= GY) p.t = p.life; }

  for (let i = P.length - 1; i >= 0; i--) if (P[i].t >= P[i].life) P.splice(i, 1);

function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  world.fx && world.fx();
  ctx.save(); ctx.globalCompositeOperation = worldId === 'sea' ? 'source-over' : worldId === 'space' ? 'screen' : 'multiply';
  for (const s of S){ const age = clock - s.born, sc = easeBack(age / .35), a = clamp((s.life - age) / s.fade, 0, 1) * (worldId === 'sea' ? .82 : worldId === 'space' ? .7 : 1);

  for (const L of lines){ const a = lineAlpha(L); if (a > 0){ world.drawLine(L, a); drawPower(L, a); } }
  E.sort((a, b) => a.z - b.z);
  for (const e of E){ if (e.fade){ ctx.save(); ctx.globalAlpha = Math.max(0, 1 - e.fade); e.draw(); ctx.restore(); } else e.draw(); }
  for (const p of P){ const k = p.t / p.life, a = 1 - k; ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);

}
let last = performance.now();
function frame(t){ const dt = Math.min(.05, (t - last) / 1000); last = t; update(dt); render(); requestAnimationFrame(frame); }

buildWorldTabs(); buildPalette(); buildTools(); palEl.classList.toggle('noglyph', worldId === 'music'); numpadEl.hidden = worldId !== 'kazu'; resize(); seeding = true; world.seed(); seeding = false; markPermanent(); spawnSavedDoodles(); startDemo(1.2);
